name: CI/CD Pipeline

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12). Main-branch pushes and
# release-published events pack once, SIGN with Certum cloud code signing
# (SHA-256 fingerprint interface, identical on .NET 9/.NET 10 SDKs, no SDK
# pin), then publish in the fixed #73 order - GitHub Packages -> GitHub
# Release -> NuGet.org - with loud failures (the NuGet.org push is never
# silently skipped). Prereleases are signed but never pushed to NuGet.org
# (#73: stable-only there). The GitHub Release is created (or updated) by
# the publish job between the GitHub Packages and NuGet.org pushes. PR
# builds never sign.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
      
    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  package:
    name: Create NuGet Packages
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Determine package version
      # Release events take the version from the release tag (v1.2.3 ->
      # 1.2.3); main pushes take it from the latest v* git tag (patch bump;
      # 1.0.0 when no tags exist yet).
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          PACKAGE_VERSION="${{ github.event.release.tag_name }}"
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
        else
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            PACKAGE_VERSION="1.0.0"
          else
            base="${latest_tag#v}"
            major="$(echo "$base" | awk -F. '{print $1}')"
            minor="$(echo "$base" | awk -F. '{print $2}')"
            patch="$(echo "$base" | awk -F. '{print $3+1}')"
            PACKAGE_VERSION="${major}.${minor}.${patch}"
          fi
        fi
        if [ -z "$PACKAGE_VERSION" ]; then
          echo "::error::Could not determine the package version."
          exit 1
        fi
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
        
    - name: Create NuGet packages
      # The csprojs carry no <Version>, so the package version is wired
      # from PACKAGE_VERSION (set in the Determine package version step).
      run: |
        echo "Packing with version $PACKAGE_VERSION"
        dotnet pack src/Liquid.Net.Core/Liquid.Net.Core.csproj --no-build --configuration Release --output ./packages -p:PackageVersion="$PACKAGE_VERSION"
        dotnet pack src/Liquid.Net.Models/Liquid.Net.Models.csproj --no-build --configuration Release --output ./packages -p:PackageVersion="$PACKAGE_VERSION"
        dotnet pack src/Liquid.Net.Training/Liquid.Net.Training.csproj --no-build --configuration Release --output ./packages -p:PackageVersion="$PACKAGE_VERSION"
        dotnet pack src/Liquid.Net.Utilities/Liquid.Net.Utilities.csproj --no-build --configuration Release --output ./packages -p:PackageVersion="$PACKAGE_VERSION"
        
    - name: Upload NuGet packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages-unsigned
        path: ./packages/*.nupkg

  sign:
    name: Sign NuGet Packages (Certum cloud)
    runs-on: windows-latest
    needs: package
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-unsigned
        path: packages/

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem packages/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem packages/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages-signed
        path: packages/*.nupkg

  publish:
    name: Publish (GitHub Packages -> Release -> NuGet.org)
    runs-on: ubuntu-latest
    needs: [package, sign]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      packages: write
      id-token: write # OIDC token issuance for NuGet trusted publishing

    steps:
    - name: Download signed packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-signed
        path: packages/

    # Publishing order per org decision #73: GitHub Packages first, then the
    # GitHub Release (created/updated here), NuGet.org last. The NuGet.org
    # push is never silently skipped - a failure is a visible red job.
    # Prereleases go to GitHub Packages only, never to NuGet.org.
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate

    - name: Determine version
      # The release tag derives from the packed Core package filename
      # (DevelApp.Liquid.Net.Core.<version>.nupkg).
      run: |
        shopt -s nullglob
        core=(packages/DevelApp.Liquid.Net.Core*.nupkg)
        if [ "${#core[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one Core package file, found ${#core[@]}."
          exit 1
        fi
        VERSION="$(basename "${core[0]}" | awk -F. '{print $(NF-3) "." $(NF-2) "." $(NF-1)}')"
        if [ -z "$VERSION" ]; then
          echo "::error::Could not derive the version from ${core[0]}."
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION }}
        name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: packages/*.nupkg

    - name: NuGet.org login (OIDC -> temp API key)
      # Trusted publishing (org standard; the long-lived NUGET_API_KEY secret is
      # gone): this job's GitHub OIDC token is exchanged for a ~1-hour nuget.org
      # API key, validated against the trusted publishing policy registered on
      # nuget.org for this repository + workflow:
      #   Repository Owner: DevelApp-ai
      #   Repository:      Liquid.Net
      #   Workflow File:   ci.yml
      #   Environment:     (none - this job uses no environment)
      # NUGET_USER = the nuget.org profile name of the owning account (NOT an
      # email address). The login runs close to the push (the temp key is
      # short-lived). Fails loudly if the policy is not (yet) registered.
      id: nuget-login
      if: ${{ !github.event.release.prerelease }}
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet.org (stable releases only)
      if: ${{ !github.event.release.prerelease }}
      # Keyless trusted-publishing key from the login step above.
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run benchmark infrastructure tests
      run: |
        echo "Testing benchmark infrastructure with small samples..."
        dotnet run --project src/Liquid.Net.Benchmarks/Liquid.Net.Benchmarks.csproj --configuration Release ci
      
    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-test-results
        path: |
          *.log
          test-results/
        if-no-files-found: ignore